# CareBridge model gateway.
# Add future deployments under the same model_name to enable routing/fallbacks.
# Worst case per request: (1 + num_retries) attempts on the primary plus the
# fallback, each capped by timeout. Keep the total below the Edge Function's
# 55s gateway timeout.
model_list:
  # Primary deployment.
  - model_name: carebridge-agent
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      order: 1
      timeout: 15

  # Native LiteLLM failover deployment in the same model group.
  - model_name: carebridge-agent
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      timeout: 15

router_settings:
  num_retries: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
