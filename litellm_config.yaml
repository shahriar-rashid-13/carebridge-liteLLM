# CareBridge model gateway.
# The application only calls `carebridge-agent`. Each deployment has its own
# model group so routing is deterministic: Gemini always serves first and the
# fallback group is used only when the primary fails.
# Worst case per request: primary + retry + both fallback timeouts. Keep the
# total below the Edge Function's 55s gateway timeout.
model_list:
  - model_name: carebridge-agent
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 12

  # Same Gemini model on a second key (separate free-tier quota), tried once
  # before the non-Gemini fallback. It covers both short-lived 503 "high demand"
  # errors and 429 quota errors on the first key, and a Gemini answer keeps the
  # thought signatures needed for later tool rounds.
  - model_name: carebridge-agent-retry
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/SECOND_GEMINI_API_KEY
      timeout: 12

  - model_name: carebridge-agent-fallback
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 12

  # Second non-Gemini fallback on a separate OpenRouter key, for when the free
  # Nvidia model is overloaded.
  - model_name: carebridge-agent-fallback-2
    litellm_params:
      model: openrouter/qwen/qwen3.8-27b:free
      api_key: os.environ/OPENROUTER_API_KEY_2
      timeout: 12
      # With reasoning on, a single tool call takes over 20s, beyond the timeout.
      extra_body:
        reasoning:
          enabled: false

  # Embeddings for the RAG corpus. Documents and queries must use this same
  # model and dimension; changing either requires re-embedding the corpus.
  - model_name: carebridge-embed
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
      dimensions: 768
      timeout: 20

  # Same embedding model on the second key, so vectors stay compatible.
  - model_name: carebridge-embed-2
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/SECOND_GEMINI_API_KEY
      dimensions: 768
      timeout: 20

  # LLM-as-judge for evaluations only; never called by the application. A
  # different Gemini model from the answer model reduces self-grading bias and
  # draws on a separate per-model quota.
  - model_name: carebridge-judge
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/SECOND_GEMINI_API_KEY
      timeout: 30

  - model_name: carebridge-judge-2
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 30

router_settings:
  num_retries: 0
  fallbacks:
    - carebridge-agent: ["carebridge-agent-retry", "carebridge-agent-fallback", "carebridge-agent-fallback-2"]
    # The Edge Function calls the fallback group directly for later tool rounds.
    - carebridge-agent-fallback: ["carebridge-agent-fallback-2"]
    - carebridge-embed: ["carebridge-embed-2"]
    - carebridge-judge: ["carebridge-judge-2"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
